<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img"><style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;font-size:18px;fill:#0F2C59}.an-m{text-anchor:middle}.an-s{text-anchor:start}.an-e{text-anchor:end}.s{font-size:15px}.xs{font-size:13px}.b{font-weight:700}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0F2C59"/></marker></defs><rect width="900" height="400" fill="#fafaf9"/><rect x="330" y="40" width="240" height="56" rx="10" fill="#dbe6f1" stroke="#0F2C59" stroke-width="1.5"/><text x="450" y="74" class="an-m b">그래프 위의 문제</text><path d="M400 96 L230 140" fill="none" stroke="#0F2C59" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M500 96 L670 140" fill="none" stroke="#0F2C59" stroke-width="2.4" marker-end="url(#arrow)"/><text x="200" y="168" class="an-m b">전용 알고리즘</text><text x="700" y="168" class="an-m b">특징 공학</text><rect x="40" y="186" width="330" height="104" rx="10" fill="#e8eef5" stroke="#0F2C59" stroke-width="1.5"/><text x="205" y="216" class="an-m s">그래프 구조를 직접 처리</text><text x="205" y="242" class="an-m s">노드 특징과 이웃 관계를</text><text x="205" y="268" class="an-m s">동시에 고려해 예측</text><rect x="530" y="186" width="330" height="104" rx="10" fill="#e8eef5" stroke="#0F2C59" stroke-width="1.5"/><text x="695" y="216" class="an-m s">그래프 구조를 특징 벡터로 변환</text><text x="695" y="242" class="an-m s">기존 ML 알고리즘 생태계 전체 사용</text><text x="695" y="268" class="an-m s">난관은 적절한 특징의 정의로 이동</text><path d="M205 290 V330" fill="none" stroke="#0F2C59" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M695 290 V330" fill="none" stroke="#0F2C59" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="40" y="330" width="330" height="50" rx="10" fill="#ffffff" stroke="#0F2C59" stroke-width="1.5"/><text x="205" y="361" class="an-m s">예 — 집단 분류</text><rect x="530" y="330" width="330" height="50" rx="10" fill="#ffffff" stroke="#0F2C59" stroke-width="1.5"/><text x="695" y="361" class="an-m s">4부가 집중하는 경로</text></svg>