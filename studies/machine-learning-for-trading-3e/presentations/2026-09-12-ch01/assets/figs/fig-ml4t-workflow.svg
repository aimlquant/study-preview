<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d">
  <style>
    .t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
    .an-s{text-anchor:start} .an-m{text-anchor:middle} .an-e{text-anchor:end}
    .h{font-size:16px;font-weight:900;fill:#0F0F10}
    .b{font-size:14px;font-weight:800;fill:#0F0F10}
    .s{font-size:13px;font-weight:700;fill:#0F0F10}
    .xs{font-size:12px;font-weight:700;fill:#475569}
    .num{font-size:15px;font-weight:900;fill:#0F2C59}
    .numw{font-size:15px;font-weight:900;fill:#FFFFFF}
    .numd{font-size:15px;font-weight:900;fill:#0F0F10}
    .inv{fill:#FFFFFF}
    .box{fill:#FFFFFF;stroke:#0F2C59;stroke-width:2;rx:10}
    .boxa{fill:#E8EDF5;stroke:#0F2C59;stroke-width:2;rx:10}
    .boxd{fill:#0F2C59;stroke:#0F2C59;stroke-width:2;rx:10}
    .chip{fill:#0F2C59;stroke:none;rx:9}
    .band{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.5;rx:14}
    .conn{fill:none;stroke:#0F2C59;stroke-width:2.2}
    .dash{fill:none;stroke:#64748B;stroke-width:2;stroke-dasharray:7 5}
    .axis{fill:none;stroke:#94A3B8;stroke-width:1.5}
    .grid{fill:none;stroke:#E2E8F0;stroke-width:1}
    .bar1{fill:#0F2C59}
    .bar2{fill:#9AB0CC}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
  <title id="t">ML4T 워크플로: 데이터 인프라, 전략 연구 루프, 증거 경계</title>
  <desc id="d">바깥 계층인 데이터 인프라가 전체를 감싸고, 그 안의 전략 연구가 연구·증거 프레임워크에서 특성 공학과 모델 개발을 양방향으로 반복한 뒤 전략 설계로 이어진다. 조정과 평가를 가르는 점선이 증거 경계이며 이 선을 건넌 결과만 배포와 모니터링으로 내려간다. 운영 결과는 재학습·일시 중지·폐기 피드백으로 연구 프레임워크에 되돌아간다.</desc>
  <rect x="0" y="0" width="960" height="500" fill="#FAFAF9"/>
  <rect class="band" x="24" y="24" width="912" height="452"/>
  <rect class="chip" x="44" y="38" width="230" height="30"/>
  <text class="t s an-m inv" x="159" y="58">데이터 인프라 (2–5장)</text>
  <rect x="48" y="84" width="864" height="232" rx="12" fill="#FFFFFF" stroke="#0F2C59" stroke-width="1.5"/>
  <rect class="chip" x="68" y="96" width="200" height="28"/>
  <text class="t xs an-m inv" x="168" y="115">전략 연구 (6–21장)</text>
  <rect class="boxa" x="74" y="148" width="188" height="74"/>
  <text class="t b an-m" x="168.0" y="181">연구·증거</text>
  <text class="t b an-m" x="168.0" y="199">프레임워크</text>
  <rect class="boxa" x="292" y="148" width="188" height="74"/>
  <text class="t b an-m" x="386.0" y="190">특성 공학</text>
  <rect class="boxa" x="510" y="148" width="188" height="74"/>
  <text class="t b an-m" x="604.0" y="190">모델 개발</text>
  <rect class="boxa" x="728" y="148" width="188" height="74"/>
  <text class="t b an-m" x="822.0" y="190">전략 설계</text>
  <path class="conn" marker-end="url(#ar)" d="M262 185 H292"/>
  <path class="conn" marker-end="url(#ar)" marker-start="url(#ar)" d="M480 204 H510"/>
  <path class="conn" marker-end="url(#ar)" marker-start="url(#ar)" d="M698 204 H728"/>
  <path class="dash" d="M480 246 V304"/>
  <rect class="band" x="300" y="252" width="168" height="30"/>
  <text class="t s an-m" x="384.0" y="272">조정(tuning)</text>
  <rect class="band" x="492" y="252" width="168" height="30"/>
  <text class="t s an-m" x="576.0" y="272">평가(evaluation)</text>
  <rect class="boxd" x="330" y="292" width="300" height="26"/>
  <text class="t s an-m inv" x="480.0" y="310">증거 경계</text>
  <rect class="box" x="292" y="350" width="380" height="76"/>
  <text class="t b an-m" x="482.0" y="384">배포와 모니터링 (25–26장)</text>
  <text class="t b an-m" x="482.0" y="402">섀도 → 카나리 → 전체 규모</text>
  <path class="conn" marker-end="url(#ar)" d="M482 318 V350"/>
  <path class="dash" marker-end="url(#arg)" d="M292 388 H56 V185 H74"/>
  <rect class="band" x="700" y="366" width="210" height="44"/>
  <text class="t s an-m" x="805.0" y="393">재학습·일시 중지·폐기</text>
  <path class="dash" marker-end="url(#arg)" d="M700 388 H672"/>
</svg>
