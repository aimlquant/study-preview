  <rect class="bar1" x="604" y="266" width="62" height="16" rx="4"/>
  <text class="t numd an-m" x="635" y="258">0.12</text>
  <path class="axis" d="M506 282 H688"/>
  <text class="t xs an-m" x="551" y="302">리스크 온</text>
  <text class="t xs an-m" x="635" y="302">리스크 오프</text>
