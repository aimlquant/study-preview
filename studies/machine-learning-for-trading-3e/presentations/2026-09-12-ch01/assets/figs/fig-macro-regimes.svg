  <title id="t">거시 국면과 시장 변동성·낙폭, 2003–2026</title>
  <desc id="d">왼쪽은 2003년부터 2026년까지의 연도축 위에 글로벌 금융위기 2008년, 코로나 2020년, 인플레이션 2022년을 표시한다. 오른쪽은 확장·긴축·회복·위기 네 거시 국면의 연율화 변동성을 12, 15, 15, 16퍼센트로, 최대 낙폭 크기를 15, 42, 53, 10퍼센트로 비교한다. 변동성은 좁게 움직이지만 낙폭은 크게 벌어진다.</desc>
